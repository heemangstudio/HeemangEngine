[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/heemangstudio/HeemangEngine"
publish = false

[workspace.dependencies]
hm-model = { path = "crates/hm-model" }
hm-hwp5 = { path = "crates/hm-hwp5" }
hm-hwpx = { path = "crates/hm-hwpx" }
hm-fonts = { path = "crates/hm-fonts" }
hm-layout = { path = "crates/hm-layout" }
hm-render = { path = "crates/hm-render" }
hm-edit = { path = "crates/hm-edit" }
hm-cli = { path = "crates/hm-cli" }
hm-wasm = { path = "crates/hm-wasm" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

# Optimized but quick to rebuild, for parity rounds.
[profile.parity]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.wasm-release]
inherits = "release"
panic = "abort"
